name: mini_katalog
description: "Patika kamp ve yürüyüş ekipmanları mini kataloğu."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/products.json
    - assets/images/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif.ttf
